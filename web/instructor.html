<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="console-page">
  <main id="login" class="card">
    <h1>Radio Control</h1>
    <form id="login-form">
      <label>Callsign <input id="callsign" value="CONTROL" maxlength="20" required></label>
      <label id="pw-row">Instructor password <input id="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
      <button type="submit">Open console</button>
      <p id="login-error" class="error"></p>
    </form>
  </main>

  <div id="console" hidden>
    <header class="console-head">
      <strong>Radio Control</strong>
      <span id="me"></span>
      <span id="net">connecting…</span>
      <span id="hearing" class="hearing"></span>
      <span id="mic-warn" class="error"></span>
      <a href="#" id="logout">Log out</a>
    </header>

    <div class="console-grid">
      <section class="panel">
        <h2>Transmit as Control</h2>
        <div class="row">
          <select id="tx-ch"></select>
          <button id="ptt" class="ptt small">PUSH TO TALK</button>
        </div>
        <label class="check"><input id="latch" type="checkbox"> Tap to talk / tap to stop</label>
        <div id="tx-status" class="hint">Ready</div>
        <label>Volume <input id="volume" type="range" min="0" max="1.5" step="0.05" value="0.8"></label>
        <label>Microphone <select id="mic-sel"></select></label>
        <label>Mic sensitivity <input id="mic-sens" type="range" min="0" max="1" step="0.05" value="0.55">
        <div id="mic-meter" class="meter"><div class="meter-fill"></div></div></label>
        <label id="spk-row">Speaker <select id="spk-sel"></select></label>

        <h2>Channels</h2>
        <div id="channels"></div>
      </section>

      <section class="panel">
        <h2>Send a prompt</h2>
        <div class="row">
          <label>To <select id="prompt-to"></select></label>
          <label>Preset <select id="prompt-preset"></select></label>
        </div>
        <textarea id="prompt-text" rows="3" placeholder="What the participant sees on their radio screen"></textarea>
        <button id="prompt-send">Send prompt</button>

        <h2>Radios</h2>
        <table class="roster">
          <thead><tr><th>Callsign</th><th>Channel</th><th></th></tr></thead>
          <tbody id="roster"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script type="module" src="console.js"></script>
</body>
</html>
