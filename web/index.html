<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radio Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="radio-page">
  <main id="login" class="card">
    <h1>Radio Practice</h1>
    <form id="login-form">
      <label>Callsign <input id="callsign" autocomplete="nickname" maxlength="20" required></label>
      <label>Password <input id="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
      <button type="submit">Power on</button>
      <p id="login-error" class="error"></p>
    </form>
    <p class="hint">Your browser will ask for microphone access.</p>
  </main>

  <!-- Mounted after login. -->
  <template id="radio-view">
    <main id="radio">
      <div class="layout">
        <div class="radio-col">
          <div class="radio">
            <div class="lcd">
              <div class="lcd-top">
                <span id="chnum">CH 1</span>
                <span id="mode" class="tag">DIG</span>
                <span id="scan-ind" class="tag" hidden>SCAN</span>
              </div>
              <div id="chname" class="lcd-name">—</div>
              <div id="chsub" class="lcd-sub" hidden>ALL REPEATERS</div>
              <div id="status" class="lcd-status">READY</div>
              <!-- #status ticks every second while transmitting; this only changes when the state does. -->
              <span id="status-live" class="sr-only" role="status"></span>
            </div>

            <div class="leds">
              <span><i id="led-tx" class="led tx"></i>TX</span>
              <span><i id="led-rx" class="led rx"></i>RX</span>
            </div>

            <div class="knobs">
              <button id="ch-down" aria-label="Channel down">◀</button>
              <span class="knob-label">CHANNEL</span>
              <button id="ch-up" aria-label="Channel up">▶</button>
              <button id="scan" class="toggle" aria-pressed="false">SCAN</button>
            </div>

            <button id="ptt" class="ptt" aria-pressed="false">PUSH TO TALK</button>
            <p class="hint center">Hold the button, or hold the space bar.</p>

            <div class="settings">
              <label>Volume <input id="volume" type="range" min="0" max="1.5" step="0.05" value="0.8"></label>
              <label>Microphone <select id="mic-sel"></select></label>
              <div class="mic-level">Mic level
              <div id="mic-meter" class="meter" role="meter" aria-label="Mic level" aria-valuemin="-80" aria-valuemax="0" aria-valuenow="-80"><div class="meter-fill"></div></div></div>
              <label id="spk-row">Speaker <select id="spk-sel"></select></label>
              <label class="check"><input id="latch" type="checkbox"> Tap to talk / tap to stop</label>
              <label class="check"><input id="show-controls" type="checkbox"> Show app controls</label>
            </div>
          </div>

          <section id="popups" aria-live="polite"></section>
        </div>

        <aside id="app-controls" class="panel" aria-label="App controls" hidden>
          <h2 id="roster-head">On the network</h2>
          <table class="roster" aria-labelledby="roster-head">
            <thead><tr><th>Callsign</th><th>Channel</th><th><span class="sr-only">Transmitting</span></th></tr></thead>
            <tbody id="roster"></tbody>
          </table>

          <h2>Messages</h2>
          <ol id="msg-log" class="msg-log" aria-label="Messages"></ol>
          <form id="msg-form" class="msg-form">
            <input id="msg-text" aria-label="Message to everyone" placeholder="Message everyone" maxlength="500" autocomplete="off">
            <button type="submit">Send</button>
          </form>
        </aside>
      </div>

      <footer class="footer">
        <span id="me"></span> · <span id="net">connecting…</span> ·
        <span role="status"><span id="mic-warn" class="error" hidden><span id="mic-msg"></span> <button id="mic-retry" class="link-btn">Try again</button></span> <span id="spk-warn" class="error" hidden>Sound is blocked by the browser. <button id="spk-retry" class="link-btn">Turn on sound</button></span></span> <a href="#" id="logout">Log out</a>
      </footer>
    </main>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
