# Serves plain HTTP; put a TLS-terminating reverse proxy in front of it.
#
#   1. Create .env with the password (see README).
#   2. docker compose up -d --build

services:
  radio:
    build: .
    image: radio-practice
    environment:
      # Set this in .env, not here, so the secret stays out of version control.
      # If unset, a random password is generated and printed to the log.
      - "RADIO_PASSWORD=${RADIO_PASSWORD:-}"
    ports:
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
